name: Build Health Helper APK

on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android WebView project
        run: |
          set -e
          P=android/app/src/main
          mkdir -p $P/assets $P/java/com/ammorshed/healthhelper $P/res/values $P/res/drawable
          cp index.html $P/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'HealthHelper'
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.ammorshed.healthhelper'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ammorshed.healthhelper'
                  minSdk 21
                  targetSdk 34
                  versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
                  versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
              }
              if (System.getenv('KS_FILE')) {
                  signingConfigs {
                      debug {
                          storeFile file(System.getenv('KS_FILE'))
                          storePassword System.getenv('KS_PASS')
                          keyAlias 'health'
                          keyPassword System.getenv('KS_PASS')
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p $P/res/mipmap-nodpi $P/res/mipmap-anydpi-v26
          echo '' | base64 -d > $P/res/mipmap-nodpi/ic_launcher.png
          echo '' | base64 -d > $P/res/mipmap-nodpi/ic_launcher_round.png

          cat > $P/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#C62828</color>
          </resources>
          EOF

          cat > $P/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="0.8"
                  android:scaleY="0.8"
                  android:pivotX="54"
                  android:pivotY="54">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M54,86 C54,86 24,68 24,47 C24,36 32,29 41,29 C47,29 52,32 54,37 C56,32 61,29 67,29 C76,29 84,36 84,47 C84,68 54,86 54,86 Z" />
                  <path
                      android:strokeColor="#C62828"
                      android:strokeWidth="4.5"
                      android:strokeLineCap="round"
                      android:strokeLineJoin="round"
                      android:pathData="M30,55 L43,55 L49,43 L57,68 L62,55 L78,55" />
              </group>
          </vector>
          EOF

          for N in ic_launcher ic_launcher_round; do
            cat > $P/res/mipmap-anydpi-v26/$N.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          done

          cat > $P/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">স্বাস্থ্য সহায়ক</string>
          </resources>
          EOF

          cat > $P/java/com/ammorshed/healthhelper/MainActivity.java <<'EOF'
          package com.ammorshed.healthhelper;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }
          }
          EOF

      - name: Prepare permanent signing key
        env:
          KS_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::warning::KEY_PASS secret is not set. Building with a temporary key (updates will need uninstall)."
            exit 0
          fi
          KS="$RUNNER_TEMP/health.keystore"
          if [ -f keystore/health.keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KS_PASS \
              -in keystore/health.keystore.enc -out "$KS" \
              || { echo "::error::Could not decrypt the signing key. KEY_PASS is different from the one used the first time."; exit 1; }
          else
            keytool -genkeypair -keystore "$KS" -alias health -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Health Helper"
            mkdir -p keystore
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KS_PASS \
              -in "$KS" -out keystore/health.keystore.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add keystore/health.keystore.enc
            git commit -m "Add encrypted signing key"
            git push
          fi
          echo "KS_FILE=$KS" >> "$GITHUB_ENV"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk health-helper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: health-helper-apk
          path: health-helper.apk

      - name: Publish to Releases (permanent link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: স্বাস্থ্য সহায়ক v${{ github.run_number }}
          files: health-helper.apk
